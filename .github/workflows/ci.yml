name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the pipelines the examples need
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy matplotlib statsmodels pillow reportlab pypdf openpyxl pyarrow

      - name: Unit and invariant tests
        run: python tests/test_pipeline_invariants.py

      - name: Numerical references and artifact integrity
        run: python tests/test_reliability.py

      - name: Installed wheel outside the checkout
        if: matrix.python == '3.13'
        run: python tests/test_distribution.py

      - name: Completed-run tampering and PDF recovery
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python tests/test_pipeline_integrity.py

      - uses: actions/setup-node@v7
        if: matrix.python == '3.13'
        with:
          node-version: '22'

      - name: Packed npm launcher and analysis outside the checkout
        if: matrix.python == '3.13'
        run: npm test

      - name: One-command iris pipeline
        run: |
          python scripts/run_pipeline.py --in examples/iris/iris_dirty.csv --out examples/iris/outputs --title "Iris morphometrics" --journal nature
          python scripts/state_keeper.py --state examples/iris/outputs/state.json --validate

      - name: Audit must report exactly the one known open question
        shell: bash
        run: |
          set +e
          python scripts/final_audit.py --outdir examples/iris/outputs --journal nature
          code=$?
          set -e
          python - <<'PY'
          import json, sys
          p = "examples/iris/outputs/audit/final_audit.json"
          d = json.load(open(p, encoding="utf-8"))
          fails = [g["gate"] for g in d["gates"] if g["status"] == "FAIL"]
          assert fails == [1], "expected only gate 1 to fail, got %r" % fails
          assert all(c["status"] == "PASS" for c in d["structural"]), d["structural"]
          warns = [g["gate"] for g in d["gates"] if g["status"] == "WARN"]
          assert warns == [2], "missingness mechanism must remain unresolved: %r" % warns
          print("audit OK: unit undeclared, missingness unresolved, structural clean")
          PY
          test "$code" = "1"

      - name: The PDF must be a real PDF with pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("examples/iris/outputs/report.pdf")
          data = p.read_bytes()
          assert data[:5] == b"%PDF-", "not a PDF"
          assert p.stat().st_size > 20000, p.stat().st_size
          print("PDF OK: %d bytes" % p.stat().st_size)
          PY

      - name: Answers round-trip through the one-command runner
        shell: bash
        run: |
          set +e
          python scripts/run_pipeline.py --in examples/column_traps/traps_dirty.csv --out outputs/traps-answers --title "Traps answers" ; code=$?
          set -e
          test "$code" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("outputs/traps-answers")
          tpl = json.loads((out / "answers.template.json").read_text(encoding="utf-8"))
          hold = next(d for d in tpl["decisions"]
                      if d["id"].startswith("coerce_numeric@"))
          assert tpl.get("run", {}).get("unit_key", {}).get("required"), \
              "the template does not carry the run-level questions"
          doc = {
              "run": {"journal": "nejm"},
              "decisions": [{"id": hold["id"], "action": "coerce",
                             "rationale": "ci: numeric per codebook",
                             "decided_by": "ci"}],
          }
          (out / "answers.json").write_text(json.dumps(doc), encoding="utf-8")
          state = json.loads((out / "state.json").read_text(encoding="utf-8"))
          for s in ("cleaning_plan", "report", "audit"):
              state["stages"].pop(s, None)
          (out / "state.json").write_text(json.dumps(state), encoding="utf-8")
          print("answers prepared")
          PY
          set +e
          python scripts/run_pipeline.py --resume outputs/traps-answers/state.json --answers outputs/traps-answers/answers.json ; code=$?
          set -e
          test "$code" = "0" -o "$code" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("outputs/traps-answers")
          plan = json.loads((out / "cleaning_plan.json").read_text(encoding="utf-8"))
          flag = next(f for f in plan["never_automatic_flags"]
                      if f["id"].startswith("coerce_numeric@")
                      and f.get("resolved"))
          assert flag["resolved"]["decided_by"] == "ci", flag
          aud = json.loads((out / "audit" / "final_audit.json").read_text(encoding="utf-8"))
          label = aud.get("journal", {}).get("label", "")
          assert "NEJM" in label, "run block journal did not reach the audit: %r" % label
          print("answers round-trip OK: decision resolved with provenance, journal applied")
          PY

  modality-profilers:
    name: modality profilers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy matplotlib statsmodels pillow reportlab
      - name: Route a mixed folder
        run: |
          # examples/ also holds generator and replay scripts (*.py), which the
          # router correctly classifies as unknown and exits 1 on; the mixed
          # folder is assembled from data files only, as a user would hand over
          mkdir /tmp/mixed
          cp examples/iris/iris_dirty.csv examples/timeseries/sensor_log.csv /tmp/mixed/
          cp examples/text/corpus/run_a.txt /tmp/mixed/
          cp examples/media/images/scene.png /tmp/mixed/
          cp examples/geo/stations.geojson /tmp/mixed/
          python scripts/route_input.py --in /tmp/mixed --deep --out /tmp/route.json
      - name: Time series
        run: |
          python scripts/profile_timeseries.py --in examples/timeseries/sensor_log.csv --out /tmp/ts.json
          python scripts/timeseries_analysis.py --in examples/timeseries/sensor_log.csv --profile /tmp/ts.json --out /tmp/ts-stats.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/ts-stats.json", encoding="utf-8"))
          assert d["estimable"], d
          for key in ("mann_kendall", "sen_slope", "changepoint"):
              assert d["stats"][key].get("estimable"), (key, d["stats"][key])
          assert d["stats"]["sen_slope"]["ci95"], d["stats"]["sen_slope"]
          print("time-series statistics OK: n=%s period=%s" % (d["n_obs"], d["stats"]["stl"].get("period")))
          PY
      - name: Text corpus
        run: python scripts/profile_text.py --in examples/text/corpus --out /tmp/text.json
      - name: Image set
        run: python scripts/profile_media.py --in examples/media/images --kind image --out /tmp/img.json
      - name: Geospatial
        run: python scripts/profile_geospatial.py --in examples/geo/stations.geojson --out /tmp/geo.json
      - name: Profile-only report path
        run: |
          python scripts/run_pipeline.py --in examples/text/corpus --out /tmp/text-report --title "Text corpus"
          python scripts/state_keeper.py --state /tmp/text-report/state.json --validate
